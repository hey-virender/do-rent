name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Advisory for now: there is a known backlog of ~20 lint errors in
      # application code, four of which need React refactors rather than
      # one-line fixes. Reported on every run so the number is visible and
      # shrinking, but not yet a merge gate.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # The actual gate.
      - name: Run tests
        run: npm test
